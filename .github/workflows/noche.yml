name: Calendario - resumen y recordatorios
on:
  schedule:
    # Cada 3 h: GitHub retrasa (o se salta) los cron programados, así que no se depende de una hora
    # exacta. calendario.py manda el resumen una vez por semana y no repite recordatorios.
    - cron: "23 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calendario
  cancel-in-progress: false
jobs:
  noche:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resumen semanal y recordatorios
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || secrets.YOUR_SECRET_NAME }}
        run: |
          python calendario.py noche
      - name: Guardar estado
        run: |
          git config user.name "calendario-bot"
          git config user.email "calendario-bot@users.noreply.github.com"
          git add estado.json semana.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Estado calendario" && git pull --rebase && git push)
      - name: Avisar si ha fallado
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || secrets.YOUR_SECRET_NAME }}
        run: |
          curl -s -H "Title: ❌ Falló el calendario económico" -H "Priority: high" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "La ejecución nocturna ha fallado. Toca para ver el error." "https://ntfy.sh/$NTFY_TOPIC"
